<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContextOS — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="proj-header">
  <span class="proj-header-title">Reset Password</span>
</header>

<main class="auth-main">
  <div class="auth-intro">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    <h1 class="auth-title">Set a new password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>
  </div>

  <div class="qp-field">
    <label class="qp-label" for="newPassword">New Password</label>
    <input type="password" class="import-input" id="newPassword" placeholder="At least 8 characters">
  </div>

  <p class="auth-error" id="resetError" hidden></p>

  <button class="generate-btn" id="setPasswordBtn">Set New Password</button>
</main>

<script src="script.js"></script>
</body>
</html>
