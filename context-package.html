<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContextOS — Context Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="proj-header">
  <a href="home.html" class="icon-btn" aria-label="Back">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <span class="proj-header-title output-brand">
    <svg width="22" height="22" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M85 34C77.5 25.8 66.9 21 55 21C32.4 21 14 39.4 14 62C14 84.6 32.4 103 55 103C66.9 103 77.5 98.2 85 90"
            stroke="#f5f6f8" stroke-width="13" stroke-linecap="round"/>
      <rect x="95" y="50" width="14" height="32" rx="7" fill="#2f6bff"/>
    </svg>
    ContextOS
  </span>
  <span class="header-spacer" aria-hidden="true"></span>
</header>

<main class="output-main">
  <div class="success-icon">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>

  <h1 class="output-title">Context Ready</h1>
  <p class="output-sub">Your prompt is ready to paste into any AI chat.</p>

  <div class="generated-badge">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
    <span id="generatedTime">Generated in 0 seconds</span>
  </div>

  <div class="prompt-header">
    <span class="prompt-label">COPY THIS PROMPT</span>
    <span class="prompt-charcount" id="charCount">0 characters</span>
  </div>

  <pre class="prompt-box" id="promptBox"></pre>

  <button class="generate-btn copy-btn" id="copyBtn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
    Copy Prompt
  </button>

  <p class="import-note output-footnote">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8b93a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
    Nothing is stored. Everything stays on your device.
  </p>
</main>

<script src="script.js"></script>
</body>
</html>
