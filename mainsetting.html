<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContextOS — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="proj-header">
  <a href="home.html" class="icon-btn" aria-label="Back">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <span class="proj-header-title">Settings</span>
  <span class="header-spacer" aria-hidden="true"></span>
</header>

<main class="settings-main">
  <h1 class="settings-title">Settings</h1>
  <p class="settings-sub">Manage your app preferences</p>

  <div class="settings-row">
    <span class="settings-icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </span>
    <span class="settings-text">
      <span class="settings-label">Theme</span>
      <span class="settings-value">Dark</span>
    </span>
    <svg class="settings-chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </div>

  <a href="packages.html" class="settings-row">
    <span class="settings-icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/></svg>
    </span>
    <span class="settings-text">
      <span class="settings-label">Packages</span>
      <span class="settings-value">Manage your packages</span>
    </span>
    <svg class="settings-chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </a>

  <a href="restore-license.html" class="settings-row">
    <span class="settings-icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5L20 3"/><path d="M16 7l3 3"/><path d="M13 10l3 3"/></svg>
    </span>
    <span class="settings-text">
      <span class="settings-label">Recovery Key</span>
      <span class="settings-value">Back up and restore access</span>
    </span>
    <svg class="settings-chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </a>

  <button class="settings-row settings-row--danger" id="clearDataBtn">
    <span class="settings-icon settings-icon--danger">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
    </span>
    <span class="settings-text">
      <span class="settings-label settings-label--danger">Clear All Data</span>
      <span class="settings-value">Delete all local data</span>
    </span>
    <svg class="settings-chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <div class="settings-row" id="aboutRow">
    <span class="settings-icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="8.01"/></svg>
    </span>
    <span class="settings-text">
      <span class="settings-label">About</span>
      <span class="settings-value">App info and more</span>
    </span>
    <svg class="settings-chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </div>

  <div class="settings-footer">
    <svg class="settings-footer-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M85 34C77.5 25.8 66.9 21 55 21C32.4 21 14 39.4 14 62C14 84.6 32.4 103 55 103C66.9 103 77.5 98.2 85 90"
            stroke="#f5f6f8" stroke-width="13" stroke-linecap="round"/>
      <rect x="95" y="50" width="14" height="32" rx="7" fill="#2f6bff"/>
    </svg>
    <span class="settings-footer-word">ContextOS</span>
    <p class="settings-footer-version">Version 1.0.0</p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
