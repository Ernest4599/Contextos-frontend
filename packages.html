<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContextOS — Packages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="proj-header">
  <a href="home.html" class="icon-btn" aria-label="Back">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <span class="proj-header-title">Packages</span>
  <span class="header-spacer" aria-hidden="true"></span>
</header>

<main class="import-main">
  <p class="import-subtitle" id="packagesSubtitle">Every Context Package you've generated, saved on this device.</p>

  <div id="packagesList"></div>

  <div id="packagesEmpty" hidden style="text-align:center; padding:40px 20px; color:var(--muted);">
    <p>No packages yet.</p>
    <p style="margin-top:8px; font-size:0.9rem;">Import a conversation or use Quick Prompt to generate your first one.</p>
  </div>

  <button class="action-btn" id="clearHistoryBtn" style="margin-top:8px;">Clear Package History</button>
</main>

<script src="script.js"></script>
</body>
</html>
